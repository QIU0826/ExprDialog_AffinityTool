# OpenCV配置
opencv:
  haar-cascade-path: D:\opencv-4.8.0\data\haarcascades\haarcascade_frontalface_default.xml
  image-width: 224
  image-height: 224

# 好感度配置
affinity:
  initial-score: 50
  max-score: 100
  min-score: 0
  warning-threshold: 30
  critical-threshold: 20
  cache-expiration: 3600 # 缓存过期时间（秒）
  ignore-warning-count: 3

# 表情识别配置
emotion:
  confidence-threshold: 0.6
  default-emotion: "正常"

# 对话配置
dialog:
  max-history-count: 20
  simulation-delay: 3000 # 模拟回复延迟（毫秒）

# 日志配置
logging:
  level:
    root: INFO
    com.exprdialog: DEBUG
  file:
    name: logs/expr-dialog.log
    max-size: 10MB
    max-history: 7

# 在文件中添加DeepSeek配置

