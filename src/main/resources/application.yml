server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/expr_dialog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  # 使用内嵌的缓存管理器替代Redis
  cache:
    type: simple
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 百度AI配置
baidu:
  ai:
    api-key: 7bmTiHT1L5jB90rQN2sLhKj6
    secret-key: NTsEEfnOfiyz5coegfRE70A3a5gVkrM8
    emotion-detect-url: https://aip.baidubce.com/rest/2.0/face/v3/detect
    grant-type: client_credentials
    access-token-url: https://aip.baidubce.com/oauth/2.0/token
    timeout: 10000
  # 其他API配置可以在这里添加，避免重复的baidu键
